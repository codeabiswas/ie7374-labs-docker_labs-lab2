services:
  # Service 1: Train the model
  model-training:
    image: python:3.10-slim
    container_name: ml_trainer
    working_dir: /app
    volumes:
      - ./src:/app/src
      - ./requirements.txt:/app/requirements.txt
      - model_exchange:/exchange   # Shared volume mount
    # Run training -> Copy results to shared folder
    command: >
      sh -c "pip install -r requirements.txt &&
             python src/model_training.py &&
             cp model.joblib /exchange/model.joblib &&
             cp feature_names.joblib /exchange/feature_names.joblib"

  # Service 2: Serve the model
  serving:
    image: python:3.10-slim
    container_name: ml_serving
    working_dir: /app
    ports:
      - "80:4000"
    volumes:
      - ./src:/app/src
      - ./requirements.txt:/app/requirements.txt
      - ./src/templates:/app/templates
      - ./src/statics:/app/statics
      - model_exchange:/exchange   # Shared volume mount
    depends_on:
      model-training:
        condition: service_completed_successfully
    # Copy results FROM shared folder -> Run server
    command: >
      sh -c "pip install --trusted-host pypi.python.org -r requirements.txt &&
             cp /exchange/model.joblib ./model.joblib &&
             cp /exchange/feature_names.joblib ./feature_names.joblib &&
             python src/main.py"

volumes:
  model_exchange:
